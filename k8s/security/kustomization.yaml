# Bewusst NICHT Teil von k8s/kustomization.yaml: der Root-Kustomization hat
# `namespace: ninko`, was diese Resourcen faelschlich in den ninko-Namespace
# verschieben wuerde. Separat anwenden: kubectl apply -k k8s/security/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - networkpolicy.yaml
