# ServiceAccount fuer die Scanner-Pods selbst (nicht fuer das Backend!).
# Traegt absichtlich KEINE RBAC-Bindings — Scanner sprechen nie mit der
# Kubernetes-API, sie brauchen nur Netzwerkzugriff auf ihr Scan-Target.
# executor.py setzt zusaetzlich automountServiceAccountToken: false auf
# jedem Job-Pod als zweite Verteidigungslinie.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ninko-security-scanner
  namespace: ninko-security
  labels:
    app.kubernetes.io/part-of: ninko
    app.kubernetes.io/component: security-scans
automountServiceAccountToken: false
