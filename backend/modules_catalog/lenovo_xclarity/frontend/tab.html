<!-- Lenovo XClarity Dashboard Tab -->
<style>
#xclarity-tab-content .xclarity-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}
</style>

<div id="xclarity-tab-content" class="module-tab-content">
    <div class="xclarity-grid">
        <div class="status-card" id="xclarity-card-servers">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                    <line x1="6" y1="6" x2="6" y2="6"/>
                    <line x1="6" y1="18" x2="6" y2="18"/>
                </svg>
            </span>
            <span class="status-value" id="xclarity-servers-count">-</span>
            <span class="status-label">Server</span>
        </div>
        <div class="status-card" id="xclarity-card-chassis">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                </svg>
            </span>
            <span class="status-value" id="xclarity-chassis-count">-</span>
            <span class="status-label">Chassis</span>
        </div>
        <div class="status-card" id="xclarity-card-storage">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
            </span>
            <span class="status-value" id="xclarity-storage-count">-</span>
            <span class="status-label">Storage</span>
        </div>
    </div>

    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <button type="button" class="btn btn-refresh" data-action="xclarity-refresh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <div class="k8s-section">
        <h3 class="section-title" style="text-wrap:balance">Übersicht</h3>
        <div id="xclarity-info" class="nodes-grid">
            <p class="empty-state">Keine Daten geladen.</p>
        </div>
    </div>
</div>
