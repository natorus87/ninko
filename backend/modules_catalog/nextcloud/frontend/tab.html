<!-- Nextcloud Dashboard Tab -->
<style>
#nextcloud-tab-content .nextcloud-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}
</style>

<div id="nextcloud-tab-content" class="module-tab-content">
    <div class="nextcloud-grid">
        <div class="status-card" id="nextcloud-card-users">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                </svg>
            </span>
            <span class="status-value" id="nextcloud-users-count">-</span>
            <span class="status-label">Benutzer</span>
        </div>
        <div class="status-card" id="nextcloud-card-shares">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </span>
            <span class="status-value" id="nextcloud-shares-count">-</span>
            <span class="status-label">Shares</span>
        </div>
        <div class="status-card" id="nextcloud-card-storage">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
            </span>
            <span class="status-value" id="nextcloud-storage-used">-</span>
            <span class="status-label">Speicher</span>
        </div>
    </div>

    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <button type="button" class="btn btn-refresh" data-action="nextcloud-refresh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <div class="k8s-section">
        <h3 class="section-title" style="text-wrap:balance">Übersicht</h3>
        <div id="nextcloud-info" class="nodes-grid">
            <p class="empty-state">Keine Daten geladen.</p>
        </div>
    </div>
</div>
