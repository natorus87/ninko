<div class="tab-content" id="tab-mcp-server">
  <div class="mcp-header">
    <h3>🔌 MCP Server</h3>
    <select id="mcp-server-connection-select" class="connection-select">
      <option value="">Verbindung wählen...</option>
    </select>
  </div>

  <div class="mcp-grid">
    <section class="mcp-card">
      <h4>Status</h4>
      <div class="mcp-actions">
        <button id="mcp-server-validate-btn" class="mcp-btn" type="button">Validate</button>
        <button id="mcp-server-refresh-btn" class="mcp-btn mcp-btn-secondary" type="button">Refresh</button>
      </div>
      <pre id="mcp-server-status" class="mcp-pre">Keine Verbindung ausgewählt.</pre>
    </section>
    <section class="mcp-card">
      <h4>Tools</h4>
      <div id="mcp-server-tools" class="mcp-list">Keine Daten.</div>
    </section>
    <section class="mcp-card">
      <h4>Resources</h4>
      <div id="mcp-server-resources" class="mcp-list">Keine Daten.</div>
    </section>
    <section class="mcp-card">
      <h4>Tool Call</h4>
      <label class="mcp-label" for="mcp-server-tool-name">Tool</label>
      <input id="mcp-server-tool-name" class="mcp-input" type="text" placeholder="tool_name">
      <label class="mcp-label" for="mcp-server-tool-args">Arguments (JSON)</label>
      <textarea id="mcp-server-tool-args" class="mcp-textarea" rows="8" placeholder='{"example":"value"}'>{}</textarea>
      <button id="mcp-server-call-btn" class="mcp-btn" type="button">Call Tool</button>
      <pre id="mcp-server-call-result" class="mcp-pre">Noch kein Tool-Call ausgeführt.</pre>
    </section>
  </div>
</div>
