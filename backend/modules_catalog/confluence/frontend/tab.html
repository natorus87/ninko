<!-- Confluence Dashboard Tab -->
<style>
#confluence-tab-content .cl-select { position:relative; display:inline-block; user-select:none; }
#confluence-tab-content .cl-select-btn {
    display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
    padding:0.45rem 0.75rem; border-radius:4px; cursor:pointer; touch-action:manipulation;
    border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-primary);
    font-size:0.875rem; white-space:nowrap; min-width:200px;
    transition: border-color 0.15s;
}
#confluence-tab-content .cl-select-btn:hover { border-color:var(--accent-blue); }
#confluence-tab-content .cl-select-arrow { font-size:0.65rem; opacity:0.7; transition:transform 0.15s; }
#confluence-tab-content .cl-select.open .cl-select-arrow { transform:rotate(180deg); }
#confluence-tab-content .cl-select-dropdown {
    display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:100%;
    background:var(--bg-card); border:1px solid var(--border-color);
    border-radius:4px; box-shadow:0 4px 16px rgba(0,0,0,0.4);
    z-index:999; overflow:hidden; max-height:260px; overflow-y:auto;
    overscroll-behavior: contain;
}
#confluence-tab-content .cl-select.open .cl-select-dropdown { display:block; }
#confluence-tab-content .cl-select-option {
    padding:0.45rem 0.75rem; cursor:pointer; font-size:0.875rem;
    color:var(--text-primary); white-space:nowrap;
    transition: background-color 0.1s;
}
#confluence-tab-content .cl-select-option:hover { background:rgba(255,255,255,0.07); }
#confluence-tab-content .cl-select-option.selected { color:var(--accent-blue); }
</style>

<div id="confluence-tab-content" class="module-tab-content">
    <!-- Status Cards -->
    <div class="k8s-cluster-status" id="confluence-stats">
        <div class="status-card">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
            </span>
            <span class="status-value" id="confluence-spaces-count"
                  style="font-variant-numeric: tabular-nums">-</span>
            <span class="status-label">Spaces</span>
        </div>
        <div class="status-card">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </span>
            <span class="status-value" id="confluence-pages-count"
                  style="font-variant-numeric: tabular-nums">-</span>
            <span class="status-label">Pages</span>
        </div>
    </div>

    <!-- Controls Toolbar -->
    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <div class="cl-select" id="confluence-conn-select">
            <div class="cl-select-btn" onclick="ConfluenceTab.toggleSelect('confluence-conn-select')"
                 role="button" aria-haspopup="listbox" aria-label="Connection auswählen">
                <span class="cl-select-label">Lade Verbindungen…</span>
                <span class="cl-select-arrow" aria-hidden="true">▼</span>
            </div>
            <div class="cl-select-dropdown" id="confluence-conn-options" role="listbox"></div>
        </div>

        <button type="button" class="btn btn-refresh" data-action="confluence-refresh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <!-- Content Section -->
    <div class="k8s-section">
        <h3 class="section-title" style="text-wrap:balance">Recent Pages</h3>
        <div id="confluence-pages" class="nodes-grid">
            <p class="empty-state">Keine Daten geladen. Verbindung wählen und aktualisieren.</p>
        </div>
    </div>
</div>
