<!-- HPE iLO Dashboard Tab -->
<style>
#hpe-ilo-tab-content .ilo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}
</style>

<div id="hpe-ilo-tab-content" class="module-tab-content">
    <div class="ilo-grid">
        <div class="status-card" id="ilo-card-manager">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
            </span>
            <span class="status-value" id="ilo-manager-type">-</span>
            <span class="status-label">iLO</span>
        </div>
        <div class="status-card" id="ilo-card-server">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <server x="2" y="2" width="20" height="8" rx="2"/>
                    <path d="M6 12h12M6 16h12"/>
                </svg>
            </span>
            <span class="status-value" id="ilo-server-model">-</span>
            <span class="status-label">Server</span>
        </div>
        <div class="status-card" id="ilo-card-power">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                    <line x1="12" y1="2" x2="12" y2="12"/>
                </svg>
            </span>
            <span class="status-value" id="ilo-power-state">-</span>
            <span class="status-label">Power</span>
        </div>
        <div class="status-card" id="ilo-card-health">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </span>
            <span class="status-value" id="ilo-health-state">-</span>
            <span class="status-label">Health</span>
        </div>
    </div>

    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <button type="button" class="btn btn-refresh" data-action="ilo-refresh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <div class="k8s-section">
        <h3 class="section-title" style="text-wrap:balance">Details</h3>
        <div id="ilo-details" class="nodes-grid">
            <p class="empty-state">Keine Daten geladen. Verbindung wählen und aktualisieren.</p>
        </div>
    </div>
</div>
