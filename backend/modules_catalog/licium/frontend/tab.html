<!-- Licium Wiki Dashboard Tab -->
<style>
#licium-tab-content .licium-stats {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
}
#licium-tab-content .licium-stat-card {
    flex: 1;
    min-width: 120px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}
#licium-tab-content .licium-stat-value {
    font-size: 1.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    line-height: 1;
}
#licium-tab-content .licium-stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
#licium-tab-content .licium-status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--accent-yellow);
}
#licium-tab-content .licium-status-dot.ok { background: var(--accent-green); }
#licium-tab-content .licium-status-dot.error { background: var(--accent-red); }
#licium-tab-content .licium-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
}
#licium-tab-content .licium-log-entry {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    padding: 0.35rem 0.5rem;
    border-radius: 4px;
    font-family: monospace;
    background: var(--bg-secondary);
    border-left: 2px solid var(--border-color);
}
#licium-tab-content .licium-log-entry.ingest { border-left-color: var(--accent-blue); }
#licium-tab-content .licium-log-entry.query { border-left-color: var(--accent-purple); }
#licium-tab-content .licium-log-entry.lint { border-left-color: var(--accent-yellow); }
#licium-tab-content .licium-search-input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.15s;
}
#licium-tab-content .licium-search-input:focus { border-color: var(--accent-blue); }
#licium-tab-content .licium-result-item {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    font-size: 0.8125rem;
}
#licium-tab-content .licium-result-title {
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
}
#licium-tab-content .licium-result-excerpt {
    color: var(--text-secondary);
    line-height: 1.5;
}
#licium-tab-content .wiki-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.25rem 0.625rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
}
#licium-tab-content .wiki-badge.ok {
    background: rgba(var(--accent-green-rgb, 74, 222, 128), 0.12);
    color: var(--accent-green);
}
#licium-tab-content .wiki-badge.warn {
    background: rgba(var(--accent-yellow-rgb, 250, 204, 21), 0.12);
    color: var(--accent-yellow);
}
#licium-tab-content .wiki-badge.error {
    background: rgba(var(--accent-red-rgb, 248, 113, 113), 0.12);
    color: var(--accent-red);
}
</style>

<div id="licium-tab-content" class="module-tab-content">

    <!-- Connection Toolbar -->
    <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <div class="cl-select" id="licium-conn-select">
            <div class="cl-select-btn" onclick="LiciumTab.toggleSelect()"
                 role="button" aria-haspopup="listbox" aria-label="Licium-Verbindung wählen">
                <span class="cl-select-label">Lade Verbindungen…</span>
                <span class="cl-select-arrow" aria-hidden="true">▼</span>
            </div>
            <div class="cl-select-dropdown" id="licium-conn-options" role="listbox"></div>
        </div>

        <span id="licium-conn-status" style="display:flex; align-items:center; font-size:0.8125rem; color:var(--text-muted);">
            <span class="licium-status-dot" id="licium-dot"></span>
            <span id="licium-status-text">Nicht verbunden</span>
        </span>

        <button type="button" class="btn btn-refresh" id="licium-refresh-btn"
                onclick="LiciumTab.refresh()" style="margin-left:auto;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <!-- Stats Row -->
    <div class="licium-stats">
        <div class="licium-stat-card">
            <span class="licium-stat-value" id="licium-note-count">—</span>
            <span class="licium-stat-label">Notizen gesamt</span>
        </div>
        <div class="licium-stat-card">
            <span class="licium-stat-value" id="licium-wiki-status-badge">—</span>
            <span class="licium-stat-label">Wiki-Status</span>
        </div>
        <div class="licium-stat-card">
            <span class="licium-stat-value" id="licium-version">—</span>
            <span class="licium-stat-label">Licium Version</span>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="licium-actions">
        <button type="button" class="btn btn-primary btn-sm" id="licium-setup-btn"
                onclick="LiciumTab.setupWiki()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            Wiki einrichten
        </button>
        <button type="button" class="btn btn-sm" id="licium-lint-btn"
                onclick="LiciumTab.runLint()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 11l3 3L22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            Wiki-Lint
        </button>
    </div>

    <!-- Search -->
    <div class="k8s-section" style="margin-bottom:1.5rem;">
        <h3 class="section-title">Semantische Suche</h3>
        <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem;">
            <input type="text" class="licium-search-input" id="licium-search-query"
                   placeholder="Suche in der Wissensdatenbank…"
                   onkeydown="if(event.key==='Enter') LiciumTab.search()"
                   aria-label="Suchanfrage">
            <button type="button" class="btn btn-sm btn-primary" onclick="LiciumTab.search()"
                    aria-label="Suchen">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
        </div>
        <div id="licium-search-results"></div>
    </div>

    <!-- Recent Log -->
    <div class="k8s-section">
        <h3 class="section-title">Letzte Operationen</h3>
        <div id="licium-log-entries" style="display:flex; flex-direction:column; gap:0.375rem;">
            <p class="empty-state">Verbindung herstellen um Log-Einträge zu laden.</p>
        </div>
    </div>

    <!-- Feedback Area -->
    <div id="licium-feedback" style="margin-top:1rem; display:none;"></div>
</div>
