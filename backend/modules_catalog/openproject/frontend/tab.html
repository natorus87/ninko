<!-- OpenProject Dashboard Tab -->
<style>
#openproject-tab-content .openproject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}
</style>

<div id="openproject-tab-content" class="module-tab-content">
    <div class="openproject-grid">
        <div class="status-card" id="openproject-card-projects">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
            </span>
            <span class="status-value" id="openproject-projects-count">-</span>
            <span class="status-label">Projekte</span>
        </div>
        <div class="status-card" id="openproject-card-workpackages">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
            </span>
            <span class="status-value" id="openproject-wp-count">-</span>
            <span class="status-label">Tasks</span>
        </div>
        <div class="status-card" id="openproject-card-users">
            <span class="status-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                </svg>
            </span>
            <span class="status-value" id="openproject-users-count">-</span>
            <span class="status-label">Benutzer</span>
        </div>
    </div>

    <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
        <button type="button" class="btn btn-refresh" data-action="openproject-refresh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
            </svg>
            Aktualisieren
        </button>
    </div>

    <div class="k8s-section">
        <h3 class="section-title" style="text-wrap:balance">Übersicht</h3>
        <div id="openproject-info" class="nodes-grid">
            <p class="empty-state">Keine Daten geladen.</p>
        </div>
    </div>
</div>
