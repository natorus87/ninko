<!-- Knowledge Graph Dashboard Tab -->
<div id="knowledge-graph-tab-content" class="module-tab-content">

  <!-- Header -->
  <div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.3rem; font-weight: 600; margin: 0 0 0.25rem; display: flex; align-items: center; gap: 0.5rem;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-blue);">
        <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
        <line x1="12" y1="7" x2="5" y2="17"/><line x1="12" y1="7" x2="19" y2="17"/>
        <line x1="5" y1="19" x2="19" y2="19"/>
      </svg>
      Knowledge Graph
    </h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">
      Strukturierter IT-Entitäts-Graph · Abhängigkeiten, Impact-Analyse und Graph-basiertes RAG
    </p>
  </div>

  <!-- Stats Cards -->
  <div class="k8s-cluster-status" id="kg-stats-cards">
    <div class="status-card">
      <span class="status-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent-blue)" stroke-width="2"><circle cx="12" cy="12" r="4"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><line x1="6" y1="7" x2="10" y2="10"/><line x1="18" y1="7" x2="14" y2="10"/><line x1="6" y1="17" x2="10" y2="14"/><line x1="18" y1="17" x2="14" y2="14"/></svg>
      </span>
      <span class="status-value" id="kg-stat-nodes">—</span>
      <span class="status-label">Nodes</span>
    </div>
    <div class="status-card">
      <span class="status-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent-green)" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
      <span class="status-value" id="kg-stat-edges">—</span>
      <span class="status-label">Edges</span>
    </div>
    <div class="status-card">
      <span class="status-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent-yellow, #f39c12)" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      </span>
      <span class="status-value" id="kg-stat-density">—</span>
      <span class="status-label">Dichte</span>
    </div>
    <div class="status-card">
      <span class="status-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent-purple, #9b59b6)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
      <span class="status-value" id="kg-stat-connected">—</span>
      <span class="status-label">Komponenten</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="k8s-controls" style="margin-top: 1rem; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
    <select id="kg-filter-type" style="padding: 0.4rem 0.65rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color); font-size: 0.875rem;">
      <option value="">Alle Typen</option>
      <option value="module">Module</option>
      <option value="service">Services</option>
      <option value="host">Hosts</option>
      <option value="incident">Incidents</option>
      <option value="configuration">Configurations</option>
      <option value="agent">Agents</option>
      <option value="user">Users</option>
    </select>
    <button class="btn btn-outline btn-sm" id="kg-btn-reload">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.4rem;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Neu laden
    </button>
    <button class="btn btn-outline btn-sm" id="kg-btn-fit" title="Graph einpassen">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.4rem;"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      Einpassen
    </button>
    <button class="btn btn-outline btn-sm" id="kg-btn-centrality" style="margin-left: auto;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.4rem;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Top-Nodes
    </button>
  </div>

  <!-- Main Graph Area -->
  <div class="k8s-section" style="margin-top: 1rem; padding: 0; overflow: hidden;">
    <div style="display: flex; height: 520px;">

      <!-- Graph Canvas -->
      <div style="flex: 1; position: relative; background: var(--bg-body); border-radius: 8px 0 0 8px; overflow: hidden;">
        <div id="kg-cy-container" style="width: 100%; height: 100%;"></div>

        <!-- Legend -->
        <div style="position: absolute; bottom: 0.75rem; left: 0.75rem; background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 0.6rem; font-size: 0.75rem; max-width: 380px;">
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#3498db;display:inline-block;"></span>Module</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#2ecc71;display:inline-block;"></span>Service</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#e74c3c;display:inline-block;"></span>Host</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#9b59b6;display:inline-block;"></span>Incident</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#f39c12;display:inline-block;"></span>Config</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#1abc9c;display:inline-block;"></span>User</span>
          <span style="display:flex;align-items:center;gap:0.3rem;"><span style="width:9px;height:9px;border-radius:50%;background:#16a085;display:inline-block;"></span>Agent</span>
        </div>

        <!-- Loading Overlay -->
        <div id="kg-loading" style="display:none; position:absolute;inset:0;background:var(--bg-body);opacity:0.8;align-items:center;justify-content:center;flex-direction:column;gap:0.5rem;">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--accent-blue)" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          <span style="font-size:0.85rem;color:var(--text-muted);">Lade Graph…</span>
        </div>
      </div>

      <!-- Detail Sidebar -->
      <div id="kg-detail-panel" style="width: 260px; min-width: 260px; background: var(--bg-secondary); border-left: 1px solid var(--border-color); border-radius: 0 8px 8px 0; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">

        <!-- Node Details -->
        <div>
          <h4 style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 0.75rem;">Details</h4>
          <div id="kg-node-details">
            <p style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">Klicke auf einen Node…</p>
          </div>
        </div>

        <!-- Related Entities -->
        <div>
          <h4 style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 0.75rem;">Verwandte Entitäten</h4>
          <div id="kg-related-list">
            <p style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">—</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Top Nodes Panel (hidden by default) -->
  <div id="kg-centrality-panel" style="display:none;" class="k8s-section">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
      <h3 class="section-title" style="margin:0;">Zentrale Nodes (PageRank)</h3>
      <button class="btn btn-outline btn-sm" id="kg-btn-close-centrality">Schließen</button>
    </div>
    <div id="kg-centrality-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.5rem;"></div>
  </div>


</div>
