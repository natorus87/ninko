<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninko Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        :root {
            --bg: #0f1720;
            --panel: #162433;
            --text: #e7edf5;
            --muted: #98a6b8;
            --border: #2a3c52;
            --accent: #2ea7ff;
            --accent-2: #1682d6;
            --danger: #ff7676;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(1000px 600px at 20% 10%, #163047 0%, var(--bg) 60%);
            color: var(--text);
            font-family: Manrope, Segoe UI, sans-serif;
        }
        .card {
            width: min(92vw, 420px);
            background: linear-gradient(180deg, #1a2b3d 0%, var(--panel) 100%);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .title { margin: 0 0 6px; font-size: 1.45rem; font-weight: 700; }
        .subtitle { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
        .row { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--muted); }
        input {
            width: 100%;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #0f1d2b;
            color: var(--text);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 10px; min-height: 18px; font-size: 0.86rem; color: var(--muted); }
        .msg.err { color: var(--danger); }
    </style>
</head>
<body>
    <form class="card" id="login-form">
        <h1 class="title">Ninko Login</h1>
        <p class="subtitle">Bitte mit dem Admin-Account anmelden.</p>

        <div class="row">
            <label for="username">Benutzername</label>
            <input id="username" name="username" type="text" value="admin" autocomplete="username" required>
        </div>

        <div class="row">
            <label for="password">Passwort</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button id="submit-btn" type="submit">Anmelden</button>
        <div id="msg" class="msg"></div>
    </form>

    <script>
        const form = document.getElementById('login-form');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submit-btn');

        async function checkAlreadyLoggedIn() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (!res.ok) return;
                const data = await res.json();
                if (data.authenticated) {
                    window.location.replace('/');
                }
            } catch {}
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'msg';
            msg.textContent = 'Anmeldung läuft…';
            btn.disabled = true;
            try {
                const payload = {
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                };
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.detail || 'Login fehlgeschlagen');
                }
                window.location.replace('/');
            } catch (err) {
                msg.className = 'msg err';
                msg.textContent = err.message || 'Login fehlgeschlagen';
            } finally {
                btn.disabled = false;
            }
        });

        checkAlreadyLoggedIn();
    </script>
</body>
</html>
